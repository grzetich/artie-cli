[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "artie-cli"
dynamic = ["version"]
description = "Score your API documentation for AI-readiness. Based on the Tokens Not Jokin' research."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Ed Grzetich", email = "ed.grzetich@gmail.com" }
]
keywords = ["api", "documentation", "ai", "llm", "openapi", "developer-tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Documentation",
    "Topic :: Software Development :: Documentation",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "tiktoken>=0.7.0",
]

[project.urls]
Homepage = "https://github.com/grzetich/artie-cli"
Repository = "https://github.com/grzetich/artie-cli"
Research = "https://tokensnotjokin.com"

[project.scripts]
artie = "artie.cli:app"

# Single source of truth for the version: src/artie/__init__.py. Keeping it
# in two places drifted once already (0.7.0 here vs 0.7.1 in pyproject).
[tool.hatch.version]
path = "src/artie/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/artie"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/ imports conftest helpers directly, and src/ is not installed in
# editable mode during a plain `pytest` run.
pythonpath = ["src", "tests"]

[dependency-groups]
dev = ["pytest>=8.0"]
